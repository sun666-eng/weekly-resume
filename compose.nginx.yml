# Private staging proxy. Keep loopback binding until domain/HTTPS setup is complete.
services:
  nginx:
    image: ${DOCKER_REGISTRY:-docker.io/library}/nginx:stable-alpine
    restart: unless-stopped
    mem_limit: 64m
    environment:
      NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE: "1"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx/private.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - data_network
    depends_on:
      weekly_resume:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
