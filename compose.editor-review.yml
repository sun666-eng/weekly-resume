# Local isolated acceptance environment. Example credentials only; never deploy.
name: editor_template_review
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: editor_review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: local-editor-review-only
    volumes:
      - review_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d editor_review"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: weekly-resume-editor-review:20260927-p3
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      APP_URL: http://localhost:3200
      DATABASE_URL: postgresql://review:local-editor-review-only@postgres:5432/editor_review
      AUTH_SECRET: local-editor-review-secret-not-for-production
      LOCAL_STORAGE_PATH: /app/data
    volumes:
      - review_files:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));
      start_period: 60s
      interval: 10s
      timeout: 10s
      retries: 12
volumes:
  review_db:
  review_files:
